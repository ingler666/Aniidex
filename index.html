<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ingler.me</title>
<script>
  // Si llega un enlace de inicio de sesión de la Aniidex a la portada, mándalo a /aniimo/
  if (/access_token=|error_description=/.test(location.hash)) location.replace("/aniimo/" + location.hash);
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8b923'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f1d1a;--muted:#6d675d;--line:#e3ddd0;--accent:#2e7d4f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--card:#1c1a18;--ink:#f1ede6;--muted:#a59e92;--line:#2f2c28;--accent:#5fc489;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--card:#1c1a18;--ink:#f1ede6;--muted:#a59e92;--line:#2f2c28;--accent:#5fc489;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:48px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:760px;margin:0 auto}
h1{font-size:2.2rem;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:6px 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.app{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;transition:transform .15s,border-color .15s}
a.app:hover{transform:translateY(-2px);border-color:var(--accent)}
a.app:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ic{flex:none;width:60px;height:60px;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.ic.an{background:#2e7d4f}
.app b{display:block;font-size:1.1rem}
.app span{font-size:.9rem;color:var(--muted)}
footer{margin-top:36px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>ingler.me</h1>
  <p class="sub">Mis guías y herramientas de juegos.</p>
  <div class="grid">
    <a class="app" href="/aniimo/">
      <div class="ic an" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 16 16"><ellipse cx="8" cy="11" rx="3.4" ry="2.8" fill="#fff"/><circle cx="3.6" cy="7.4" r="1.5" fill="#fff"/><circle cx="6.2" cy="4.6" r="1.6" fill="#fff"/><circle cx="9.8" cy="4.6" r="1.6" fill="#fff"/><circle cx="12.4" cy="7.4" r="1.5" fill="#fff"/></svg></div>
      <div><b>Mi Aniidex de Idyll</b><span>Aniimo · inventario, equipos y progreso</span></div>
    </a>
    <a class="app" href="/phasmophobia/">
      <div class="ic" aria-hidden="true"><img src="/phasmophobia/icon-192.png" alt=""></div>
      <div><b>Guía Phasmophobia</b><span>Fantasmas, pruebas y herramientas</span></div>
    </a>
  </div>
  <footer>ingler.me</footer>
</main>
</body>
</html>
